# Netlify Configuration for Risk-Tiered Secure Authentication Platform

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Direct all page requests (e.g. /login, /dashboard, /admin) to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
